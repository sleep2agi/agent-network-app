[package]
name = "agent-network-desktop"
version = "0.2.10"
description = "Agent Network desktop shell — Tauri 2 over the RN-web export"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "3"
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
