[package]
name = "agent-network-desktop"
version = "0.2.1"
description = "Agent Network desktop shell — Tauri 2 over the RN-web export"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
