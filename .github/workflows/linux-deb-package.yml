name: Linux deb package (TEST ONLY)
on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'local-hub-sidecar/**'
      - 'scripts/build-local-hub-sidecar.mjs'
      - 'tests/linux-deb-package/**'
      - 'tests/linux-deb-install/**'
      - 'tests/linux-native-workspace/**'
      - 'tests/linux-hub-migration/**'
      - 'tests/linux-native-daemon/**'
      - 'tests/linux-native-daemon-ui/**'
      - 'tests/local-daemon-packages/**'
      - 'scripts/seed-previous-local-hub.mjs'
      - 'scripts/with-linux-test-keyring.sh'
      - '.github/workflows/linux-deb-package.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Full source build in Ubuntu Docker (not a release)
        run: |
          source_sha=$(git rev-parse HEAD)
          docker build --build-arg SOURCE_COMMIT="$source_sha" -t anet-linux-deb:test -f tests/linux-deb-package/Dockerfile .
      - name: Inspect complete package offline
        run: docker run --rm --network none anet-linux-deb:test
      - name: Wrong-architecture negative control
        shell: bash
        run: |
          set +e
          docker run --rm --network none -e TEST_DEB_EXPECT_ARCH=arm64 anet-linux-deb:test >negative.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -F 'deb architecture matches expected' negative.log
      - name: Stage TEST ONLY artifact, without publication or updater metadata
        run: |
          docker create --name linux-deb-artifacts anet-linux-deb:test
          mkdir -p out
          docker cp linux-deb-artifacts:/app/src-tauri/target/release/bundle/deb/. out/
          docker rm linux-deb-artifacts
          printf 'TEST ONLY. Not approved for installation on production or distribution.\nSource: %s\nGUI, native IPC and upgrade not yet accepted.\n' "$(git rev-parse HEAD)" >out/TEST-ONLY.txt
          sha256sum out/*.deb >out/SHA256SUMS
      - name: Install on clean Ubuntu runtime (not the compiler image)
        run: |
          deb_sha=$(sha256sum out/*.deb | awk '{print $1}')
          source_sha=$(git rev-parse HEAD)
          docker build --build-arg DEB_IMAGE=anet-linux-deb:test --build-arg SOURCE_COMMIT="$source_sha" --build-arg DEB_SHA256="$deb_sha" -t anet-linux-install:test -f tests/linux-deb-install/Dockerfile .
      - name: Ordinary-user native window probe offline (screenshot requires review)
        run: docker run --name linux-install-proof --network none anet-linux-install:test
      - name: Wrong-source binding negative control
        shell: bash
        run: |
          deb_sha=$(sha256sum out/*.deb | awk '{print $1}')
          set +e
          docker build --build-arg DEB_IMAGE=anet-linux-deb:test --build-arg SOURCE_COMMIT=0000000000000000000000000000000000000000 --build-arg DEB_SHA256="$deb_sha" -t anet-linux-install:wrong-source -f tests/linux-deb-install/Dockerfile . >out/source-negative.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -F 'FAIL: package image source SHA does not match requested source' out/source-negative.log
      - name: Preserve window evidence even on probe failure
        if: always()
        run: |
          if docker container inspect linux-install-proof >/dev/null 2>&1; then
            mkdir -p out/window-evidence
            docker cp linux-install-proof:/evidence/. out/window-evidence/
            docker rm linux-install-proof
          fi
      - name: Early process-exit negative control
        shell: bash
        run: |
          set +e
          docker run --rm --network none -e TEST_DESKTOP_EXECUTABLE=/bin/false anet-linux-install:test >out/window-negative.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -F 'FAIL: desktop process exited before window acceptance' out/window-negative.log
      - name: Build isolated native workspace fixture
        run: |
          deb_sha=$(sha256sum out/*.deb | awk '{print $1}')
          docker build --build-arg INSTALL_IMAGE=anet-linux-install:test --build-arg SOURCE_COMMIT="$(git rev-parse HEAD)" --build-arg DEB_SHA256="$deb_sha" -t anet-native-workspace:test -f tests/linux-native-workspace/Dockerfile .
      - name: Native startup and authentication atomic gate (before UI)
        run: docker run --rm --network none anet-native-workspace:test
      - name: Unavailable Secret Service fails before application workload
        shell: bash
        run: |
          set +e
          docker run --rm --network none anet-native-workspace:test sh -c 'mkdir /tmp/disabled-keyring; ln -s /bin/false /tmp/disabled-keyring/gnome-keyring-daemon; PATH=/tmp/disabled-keyring:$PATH sh /fixture/keyring.sh echo UNEXPECTED_WORKLOAD' >out/keyring-negative.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -F 'FAIL: isolated Secret Service did not acquire D-Bus name' out/keyring-negative.log
          ! grep -F 'UNEXPECTED_WORKLOAD' out/keyring-negative.log
      - name: Real UI local workspace and native credential authentication
        run: docker run --name native-workspace-proof --network none anet-native-workspace:test sh /fixture/keyring.sh xvfb-run -a -s '-screen 0 1280x900x24 -nolisten tcp' bash /fixture/ui.sh
      - name: Missed-click negative control
        shell: bash
        run: |
          set +e
          docker run --rm --network none -e TEST_UI_MISS_CLICK=1 anet-native-workspace:test sh /fixture/keyring.sh xvfb-run -a -s '-screen 0 1280x900x24 -nolisten tcp' bash /fixture/ui.sh >out/native-click-negative.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -F 'FAIL: UI did not persist a local profile after click' out/native-click-negative.log
      - name: Preserve native UI evidence
        if: always()
        run: |
          if docker container inspect native-workspace-proof >/dev/null 2>&1; then
            mkdir -p out/native-workspace-evidence
            docker cp native-workspace-proof:/evidence/. out/native-workspace-evidence/
            docker rm native-workspace-proof
          fi
      - name: Build pinned previous-Hub migration fixture
        run: |
          deb_sha=$(sha256sum out/*.deb | awk '{print $1}')
          docker build --build-arg NATIVE_IMAGE=anet-native-workspace:test --build-arg SOURCE_COMMIT="$(git rev-parse HEAD)" --build-arg DEB_SHA256="$deb_sha" -t anet-hub-migration:test -f tests/linux-hub-migration/Dockerfile .
      - name: Previous .66 database upgrade to bundled .120
        shell: bash
        run: docker run --rm --network none anet-hub-migration:test 2>&1 | tee out/migration-upgrade.log
      - name: Failed upgrade restores exact old database and metadata
        shell: bash
        run: docker run --rm --network none anet-hub-migration:test sh /fixture/keyring.sh bash /fixture/migration.sh rollback 2>&1 | tee out/migration-rollback.log
      - name: Validate daemon package policy before native installer
        run: |
          docker build --target policy -t anet-daemon-policy:test -f tests/local-daemon-packages/Dockerfile .
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges anet-daemon-policy:test
          docker build --target private-prefix -t anet-daemon-prefix:test -f tests/local-daemon-packages/Dockerfile .
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges anet-daemon-prefix:test
      - name: Build packaged native daemon fixture
        run: |
          deb_sha=$(sha256sum out/*.deb | awk '{print $1}')
          docker build --build-arg NATIVE_IMAGE=anet-native-workspace:test --build-arg PAIR_IMAGE=anet-daemon-prefix:test --build-arg SOURCE_COMMIT="$(git rev-parse HEAD)" --build-arg DEB_SHA256="$deb_sha" -t anet-native-daemon:test -f tests/linux-native-daemon/Dockerfile .
      - name: Native daemon empty-prefix installation and registration
        shell: bash
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges anet-native-daemon:test 2>&1 | tee out/native-daemon-empty.log
      - name: Native daemon existing exact pair preserves package contents
        shell: bash
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges anet-native-daemon:test sh /fixture/keyring.sh bash /fixture/native-daemon.sh exact 2>&1 | tee out/native-daemon-exact.log
      - name: Native daemon partial package refuses before credentials and start
        shell: bash
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges anet-native-daemon:test sh /fixture/keyring.sh bash /fixture/native-daemon.sh partial 2>&1 | tee out/native-daemon-partial.log
      - name: Build real historical daemon package fixtures
        run: docker build --build-arg NATIVE_IMAGE=anet-native-daemon:test -t anet-native-daemon:legacy -f tests/linux-native-daemon/Dockerfile.legacy .
      - name: Native daemon old CLI refuses without replacement
        shell: bash
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges anet-native-daemon:legacy 2>&1 | tee out/native-daemon-old-cli.log
      - name: Native daemon old agent-node refuses without replacement
        shell: bash
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges anet-native-daemon:legacy sh /fixture/keyring.sh bash /fixture/native-daemon.sh old-node 2>&1 | tee out/native-daemon-old-node.log
      - name: Native daemon correct CLI banner cannot mask nonzero exit
        shell: bash
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges anet-native-daemon:test sh /fixture/keyring.sh bash /fixture/native-daemon.sh failed-cli 2>&1 | tee out/native-daemon-failed-cli.log
      - name: Native daemon correct CLI banner cannot mask probe timeout
        shell: bash
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges anet-native-daemon:test sh /fixture/keyring.sh bash /fixture/native-daemon.sh timeout-cli 2>&1 | tee out/native-daemon-timeout-cli.log
      - name: Build real native daemon UI fixture
        run: |
          deb_sha=$(sha256sum out/*.deb | awk '{print $1}')
          docker build --build-arg NATIVE_IMAGE=anet-native-daemon:test --build-arg SOURCE_COMMIT="$(git rev-parse HEAD)" --build-arg DEB_SHA256="$deb_sha" -t anet-native-daemon-ui:test -f tests/linux-native-daemon-ui/Dockerfile .
      - name: Real UI scan and install registers online daemon
        run: docker run --name native-daemon-ui-proof --network none --cap-drop ALL --security-opt no-new-privileges --shm-size 256m anet-native-daemon-ui:test
      - name: Missed daemon install click cannot pass registration
        shell: bash
        run: |
          set +e
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --shm-size 256m -e TEST_DAEMON_UI_MISS_CLICK=1 anet-native-daemon-ui:test >out/native-daemon-ui-negative.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -F 'AssertionError: UI install click did not register matching online daemon' out/native-daemon-ui-negative.log
      - name: Preserve native daemon UI evidence
        if: always()
        run: |
          if docker container inspect native-daemon-ui-proof >/dev/null 2>&1; then
            mkdir -p out/native-daemon-ui-evidence
            docker cp native-daemon-ui-proof:/evidence/. out/native-daemon-ui-evidence/
            docker rm native-daemon-ui-proof
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TEST-ONLY-linux-deb-${{ github.sha }}
          path: out/
          retention-days: 7
          if-no-files-found: error
