# TestFlight internal testers: list (read-only) or add one tester by email.
#
# Internal testers get every processed build immediately, without Beta App Review.
# Apple only accepts App Store Connect users of team 446BLT75JZ as internal
# testers, so `add` fails with a clear message for any other address.
#
# 🔴 The email is personal data and this repository is public.
#    * It is read from the event payload file, never through `${{ inputs.email }}`
#      or `${{ github.event.inputs.email }}`. Expressions are substituted into the
#      script text and job env, and the Actions log prints both BEFORE any
#      `::add-mask::` can run.
#    * The first thing the step does is `::add-mask::` it. After that the runner
#      replaces it with *** in every later log line, including ASC error bodies.
#    * It is never echoed, never written to $GITHUB_STEP_SUMMARY and never
#      written to any file other than the temporary request body in $RUNNER_TEMP.
#    * `list` never prints tester emails, only counts and yes/no.
#
# Uses the App Store Connect API key from the protected `macos-signing`
# environment, the same credentials as ios-build and ios-testflight-status.

name: ios TestFlight internal tester

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list = read-only counts; add = add the email below as an internal tester; grant-builds = give the internal group all builds (and attach build_number if still missing); invite = invite the email to the App Store Connect team as Developer; invite-status = read-only: is the email a team user / invited, and when does the invitation expire"
        type: choice
        options: [list, add, grant-builds, invite, invite-status]
        default: list
      email:
        description: "Apple ID email of an App Store Connect user on the team (add mode, or to check membership in list mode). Masked in the log."
        required: false
        default: ""
      first_name:
        description: "invite mode: first name for the App Store Connect invitation (the user can change it later)"
        required: false
        default: ""
      last_name:
        description: "invite mode: last name for the App Store Connect invitation"
        required: false
        default: ""
      group_name:
        description: "Internal group to use. add creates it (with access to all builds) if no internal group has this exact name; list/grant-builds fall back to the first internal group."
        required: true
        default: "Internal"
      build_number:
        description: "CFBundleVersion to report availability for"
        required: true
        default: "28"

permissions:
  contents: read

jobs:
  internal-tester:
    runs-on: ubuntu-latest
    environment: macos-signing
    steps:
      - name: Manage TestFlight internal testers without exposing the email
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          MODE: ${{ inputs.mode }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          BUNDLE_ID: top.vansin.agentnetwork
          INTERNAL_GROUP_NAME: ${{ inputs.group_name }}
        shell: bash
        run: |
          EMAIL=$(jq -r '.inputs.email // ""' "$GITHUB_EVENT_PATH" | tr -d '[:space:]'); if [ -n "$EMAIL" ]; then echo "::add-mask::$EMAIL"; fi
          set -euo pipefail

          case "$MODE" in list|add|grant-builds|invite|invite-status) ;; *) echo "::error::mode must be list, add, grant-builds, invite or invite-status"; exit 1 ;; esac
          case "$BUILD_NUMBER" in ''|*[!0-9]*) echo "::error::build_number must be numeric"; exit 1 ;; esac
          if [ -z "$INTERNAL_GROUP_NAME" ]; then echo "::error::group_name must not be empty"; exit 1; fi
          if { [ "$MODE" = 'add' ] || [ "$MODE" = 'invite' ] || [ "$MODE" = 'invite-status' ]; } && [ -z "$EMAIL" ]; then
            echo "::error::$MODE mode needs the email input"
            exit 1
          fi
          FIRST_NAME=$(jq -r '.inputs.first_name // ""' "$GITHUB_EVENT_PATH")
          LAST_NAME=$(jq -r '.inputs.last_name // ""' "$GITHUB_EVENT_PATH")
          if [ "$MODE" = 'invite' ] && { [ -z "$FIRST_NAME" ] || [ -z "$LAST_NAME" ]; }; then
            echo "::error::invite mode needs first_name and last_name"
            exit 1
          fi
          email_lc=$(printf '%s' "$EMAIL" | tr '[:upper:]' '[:lower:]')
          if [ -n "$email_lc" ] && [ "$email_lc" != "$EMAIL" ]; then echo "::add-mask::$email_lc"; fi

          jwt_file="$RUNNER_TEMP/app-store-connect.jwt"
          node <<'NODE' > "$jwt_file"
          const crypto = require('node:crypto');
          const b64url = (value) => Buffer.from(value).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const header = b64url(JSON.stringify({ alg: 'ES256', kid: process.env.APPLE_API_KEY, typ: 'JWT' }));
          const payload = b64url(JSON.stringify({
            iss: process.env.APPLE_API_ISSUER,
            iat: now,
            exp: now + 900,
            aud: 'appstoreconnect-v1',
          }));
          const unsigned = `${header}.${payload}`;
          const key = Buffer.from(process.env.APPLE_API_KEY_BASE64, 'base64').toString('utf8');
          const signature = crypto.sign('sha256', Buffer.from(unsigned), {
            key,
            dsaEncoding: 'ieee-p1363',
          }).toString('base64url');
          process.stdout.write(`${unsigned}.${signature}`);
          NODE
          chmod 600 "$jwt_file"
          jwt=$(<"$jwt_file")
          api=https://api.appstoreconnect.apple.com/v1

          asc_get() {
            local endpoint="$1"
            shift
            curl --fail-with-body --silent --show-error --get \
              -H "Authorization: Bearer $jwt" \
              -H 'Accept: application/json' \
              "$api/$endpoint" "$@"
          }

          # Writes send the JSON in file $3, print the HTTP status on stdout and leave the response body in $4,
          # so a rejection can be explained instead of just failing.
          asc_write() {
            local method="$1" endpoint="$2" body_file="$3" out_file="$4"
            curl --silent --show-error --output "$out_file" --write-out '%{http_code}' \
              --request "$method" \
              -H "Authorization: Bearer $jwt" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data @"$body_file" \
              "$api/$endpoint"
          }

          # Every page of a collection, merged into one {"data":[...]} document.
          asc_all() {
            local url="$api/$1" out="$2" page="$RUNNER_TEMP/page.json"
            echo '{"data":[]}' > "$out"
            while [ -n "$url" ] && [ "$url" != 'null' ]; do
              curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $jwt" -H 'Accept: application/json' "$url" > "$page"
              jq -s '{data: (.[0].data + .[1].data)}' "$out" "$page" > "$out.tmp" && mv "$out.tmp" "$out"
              url=$(jq -r '.links.next // empty' "$page")
            done
          }

          explain_error() {
            local status="$1" body="$2" context="${3:-}"
            echo "::error::App Store Connect answered HTTP $status"
            jq -r '.errors[]? | "  - \(.status // "") \(.code // "") \(.title // ""): \(.detail // "")"' "$body" 2>/dev/null || true
            if [ "$context" = 'tester' ] && jq -e '[.errors[]? | ((.code // "") + " " + (.detail // "") + " " + (.title // ""))] | join(" ") | test("(?i)internal|user|not.*member|STATE_ERROR|ENTITY_ERROR")' "$body" > /dev/null 2>&1; then
              echo "::error::Internal TestFlight testers must be App Store Connect users on team 446BLT75JZ. Invite this Apple ID under Users and Access first (any role), accept the invite, then run this workflow again."
            fi
          }

          # invite: add the email to the App Store Connect team as a Developer, so it can
          # later be an internal tester. Checks for an existing user / pending invitation
          # first. Reports already-member / already-invited / invited, never the email.
          if [ "$MODE" = 'invite' ] || [ "$MODE" = 'invite-status' ]; then
            asc_read() {  # like asc_get but returns the HTTP status and keeps the body
              local out="$1" endpoint="$2"; shift 2
              curl --silent --show-error --get --output "$out" --write-out '%{http_code}' \
                -H "Authorization: Bearer $jwt" -H 'Accept: application/json' \
                "$api/$endpoint" "$@"
            }
            no_permission() {
              echo "::error::The App Store Connect API key is not allowed to $1 (HTTP 403). Invite this Apple ID from the App Store Connect web UI instead: Users and Access → + → role Developer."
            }
            # Pre-check by listing every page and matching the address inside jq (case-insensitive).
            # Do not rely on filter[username]/filter[email]: on 2026-09-27 a filtered read-back
            # returned no rows for an invitation that POST had just created (HTTP 201).
            read_all() {  # read_all <out> <endpoint-with-query>; prints the HTTP status of the first failing page, or 200
              local out="$1" url="$api/$2" page="$RUNNER_TEMP/page.json" code
              echo '{"data":[]}' > "$out"
              while [ -n "$url" ] && [ "$url" != 'null' ]; do
                code=$(curl --silent --show-error --output "$page" --write-out '%{http_code}' \
                  -H "Authorization: Bearer $jwt" -H 'Accept: application/json' "$url")
                [ "$code" = '200' ] || { echo "$code"; return 0; }
                jq -s '{data: (.[0].data + .[1].data)}' "$out" "$page" > "$out.tmp" && mv "$out.tmp" "$out"
                url=$(jq -r '.links.next // empty' "$page")
              done
              echo 200
            }
            pick() {  # pick <file> <attribute>: the first row whose attribute equals the email (case-insensitive)
              jq --arg e "$email_lc" --arg attr "$2" '[.data[] | select(((.attributes[$attr] // "") | ascii_downcase) == $e)] | .[0] // empty' "$1"
            }
            users_status=$(read_all "$RUNNER_TEMP/users.json" 'users?limit=200')
            invites_status=$(read_all "$RUNNER_TEMP/invites.json" 'userInvitations?limit=200')
            state=''
            case "$users_status" in
              200) pick "$RUNNER_TEMP/users.json" username > "$RUNNER_TEMP/user-row.json"; [ -s "$RUNNER_TEMP/user-row.json" ] && state=already-member ;;
              403) echo "::warning::The API key cannot read team users (HTTP 403); cannot pre-check membership, trying the invitation anyway." ;;
              *) echo "::error::reading team users failed (HTTP $users_status)"; exit 1 ;;
            esac
            if [ -z "$state" ]; then
              case "$invites_status" in
                200) pick "$RUNNER_TEMP/invites.json" email > "$RUNNER_TEMP/invite-row.json"; [ -s "$RUNNER_TEMP/invite-row.json" ] && state=already-invited ;;
                403) echo "::warning::The API key cannot read user invitations (HTTP 403); cannot pre-check pending invitations, trying the invitation anyway." ;;
                *) echo "::error::reading user invitations failed (HTTP $invites_status)"; exit 1 ;;
              esac
            fi
            describe_invite() {  # describe_invite <row file>
              echo "roles: $(jq -r '.attributes.roles // [] | join(",")' "$1"); allAppsVisible: $(jq -r '.attributes.allAppsVisible' "$1"); provisioningAllowed: $(jq -r '.attributes.provisioningAllowed' "$1"); expires: $(jq -r '.attributes.expirationDate // "unknown"' "$1")"
            }
            if [ "$MODE" = 'invite-status' ]; then
              # Read-only diagnosis of the filtered lookups the first invite run relied on.
              f_users=$(asc_read "$RUNNER_TEMP/f-users.json" users --data-urlencode "filter[username]=$EMAIL" --data-urlencode 'limit=200')
              f_inv=$(asc_read "$RUNNER_TEMP/f-inv.json" userInvitations --data-urlencode "filter[email]=$EMAIL" --data-urlencode 'limit=200')
              echo "Unfiltered: $(jq '.data | length' "$RUNNER_TEMP/users.json") users, $(jq '.data | length' "$RUNNER_TEMP/invites.json") pending invitations on the team."
              echo "filter[username] lookup: HTTP $f_users, $(jq '.data | length' "$RUNNER_TEMP/f-users.json" 2>/dev/null || echo '?') rows. filter[email] lookup: HTTP $f_inv, $(jq '.data | length' "$RUNNER_TEMP/f-inv.json" 2>/dev/null || echo '?') rows."
              if [ -s "$RUNNER_TEMP/invite-row.json" ]; then
                if jq -e --arg e "$EMAIL" '.attributes.email == $e' "$RUNNER_TEMP/invite-row.json" > /dev/null; then same_case=yes; else same_case=no; fi
                echo "Stored invitation address equals the given one exactly (same case): $same_case"
              fi
              case "$state" in
                already-member) echo "Invitation state: already-member (roles: $(jq -r '.attributes.roles // [] | join(",")' "$RUNNER_TEMP/user-row.json"))." ;;
                already-invited) echo "Invitation state: already-invited ($(describe_invite "$RUNNER_TEMP/invite-row.json"))." ;;
                *) echo "Invitation state: none (not a team user and no pending invitation)." ;;
              esac
              rm -f "$jwt_file" "$RUNNER_TEMP/users.json" "$RUNNER_TEMP/invites.json" "$RUNNER_TEMP/f-users.json" "$RUNNER_TEMP/f-inv.json" "$RUNNER_TEMP/user-row.json" "$RUNNER_TEMP/invite-row.json"
              exit 0
            fi
            if [ "$state" = 'already-member' ]; then
              echo "Invitation state: already-member (roles: $(jq -r '.attributes.roles // [] | join(",")' "$RUNNER_TEMP/user-row.json"))."
            elif [ "$state" = 'already-invited' ]; then
              echo "Invitation state: already-invited ($(describe_invite "$RUNNER_TEMP/invite-row.json"))."
            else
              jq -n --arg email "$EMAIL" --arg first "$FIRST_NAME" --arg last "$LAST_NAME" \
                '{data:{type:"userInvitations",attributes:{email:$email,firstName:$first,lastName:$last,roles:["DEVELOPER"],allAppsVisible:true,provisioningAllowed:false}}}' \
                > "$RUNNER_TEMP/invite-body.json"
              status=$(asc_write POST userInvitations "$RUNNER_TEMP/invite-body.json" "$RUNNER_TEMP/invite-out.json")
              rm -f "$RUNNER_TEMP/invite-body.json"
              case "$status" in
                2??) ;;
                403) no_permission 'invite users'; exit 1 ;;
                *) explain_error "$status" "$RUNNER_TEMP/invite-out.json"; exit 1 ;;
              esac
              # Read back from ASC by the new invitation's id rather than trusting the write response.
              invite_id=$(jq -r '.data.id // empty' "$RUNNER_TEMP/invite-out.json")
              read_back=''
              for attempt in 1 2 3 4 5 6; do
                if [ -n "$invite_id" ] && [ "$(asc_read "$RUNNER_TEMP/invite-now.json" "userInvitations/$invite_id")" = '200' ]; then
                  jq '.data' "$RUNNER_TEMP/invite-now.json" > "$RUNNER_TEMP/invite-row.json"; read_back=yes; break
                fi
                sleep 5
              done
              if [ "$read_back" = 'yes' ]; then
                echo "Invitation state: invited ($(describe_invite "$RUNNER_TEMP/invite-row.json"))."
              else
                echo "::error::POST userInvitations returned HTTP $status but GET userInvitations/<id> did not return it."
                exit 1
              fi
            fi
            rm -f "$jwt_file" "$RUNNER_TEMP/users.json" "$RUNNER_TEMP/invites.json" "$RUNNER_TEMP/invite-out.json" "$RUNNER_TEMP/invite-now.json" "$RUNNER_TEMP/user-row.json" "$RUNNER_TEMP/invite-row.json"
            exit 0
          fi

          app_json="$RUNNER_TEMP/app.json"
          asc_get apps --data-urlencode "filter[bundleId]=$BUNDLE_ID" --data-urlencode 'limit=2' > "$app_json"
          app_id=$(jq -r '.data[0].id // empty' "$app_json")
          if [ -z "$app_id" ]; then
            echo "::error::no App Store Connect app found for $BUNDLE_ID"
            exit 1
          fi

          # 1. Internal group(s). `add` creates "Internal" when none exists; `list` never writes.
          groups_json="$RUNNER_TEMP/groups.json"
          asc_all "betaGroups?filter%5Bapp%5D=$app_id&limit=200" "$groups_json"
          internal_count=$(jq '[.data[] | select(.attributes.isInternalGroup == true)] | length' "$groups_json")
          # add: exact name only (a missing name means "create it"); list/grant-builds: exact name, else the first internal group.
          if [ "$MODE" = 'add' ]; then
            group_id=$(jq -r --arg name "$INTERNAL_GROUP_NAME" '
              [.data[] | select(.attributes.isInternalGroup == true and .attributes.name == $name)] | .[0].id // empty' "$groups_json")
          else
            group_id=$(jq -r --arg name "$INTERNAL_GROUP_NAME" '
              [.data[] | select(.attributes.isInternalGroup == true)]
              | (map(select(.attributes.name == $name)) + .) | .[0].id // empty' "$groups_json")
          fi
          if [ -n "$group_id" ]; then
            INTERNAL_GROUP_NAME=$(jq -r --arg id "$group_id" '.data[] | select(.id == $id) | .attributes.name' "$groups_json")
            echo "Using internal group \"$INTERNAL_GROUP_NAME\"."
          fi
          echo "Internal beta groups on the app: $internal_count"
          if [ -z "$group_id" ]; then
            if [ "$MODE" != 'add' ]; then
              echo "No internal beta group matches ($MODE mode does not create one)."
              [ "$MODE" = 'grant-builds' ] && { echo "::error::grant-builds needs an existing internal group"; exit 1; }
            else
              echo "Creating internal beta group \"$INTERNAL_GROUP_NAME\" (all builds available)."
              jq -n --arg app "$app_id" --arg name "$INTERNAL_GROUP_NAME" \
                '{data:{type:"betaGroups",attributes:{name:$name,isInternalGroup:true,hasAccessToAllBuilds:true},relationships:{app:{data:{type:"apps",id:$app}}}}}' \
                > "$RUNNER_TEMP/group-body.json"
              status=$(asc_write POST betaGroups "$RUNNER_TEMP/group-body.json" "$RUNNER_TEMP/group-out.json")
              case "$status" in 2??) ;; *) explain_error "$status" "$RUNNER_TEMP/group-out.json"; exit 1 ;; esac
              group_id=$(jq -r '.data.id' "$RUNNER_TEMP/group-out.json")
            fi
          fi

          testers_json="$RUNNER_TEMP/testers.json"
          in_group=no
          if [ -n "$group_id" ]; then
            asc_all "betaGroups/$group_id/betaTesters?limit=200&fields%5BbetaTesters%5D=email" "$testers_json"
            if [ -n "$email_lc" ] && jq -e --arg e "$email_lc" 'any(.data[]; ((.attributes.email // "") | ascii_downcase) == $e)' "$testers_json" > /dev/null; then
              in_group=yes
            fi
          else
            echo '{"data":[]}' > "$testers_json"
          fi

          # 2./3. Add, unless already there.
          if [ "$MODE" = 'add' ]; then
            if [ "$in_group" = 'yes' ]; then
              echo "The given Apple ID is already an internal tester in \"$INTERNAL_GROUP_NAME\"; nothing to do."
            else
              existing_json="$RUNNER_TEMP/existing-tester.json"
              asc_get betaTesters --data-urlencode "filter[email]=$EMAIL" --data-urlencode 'limit=2' > "$existing_json"
              tester_id=$(jq -r '.data[0].id // empty' "$existing_json")
              if [ -n "$tester_id" ]; then
                echo "A beta tester with this Apple ID already exists on the account; adding it to the internal group."
                jq -n --arg id "$tester_id" '{data:[{type:"betaTesters",id:$id}]}' > "$RUNNER_TEMP/add-body.json"
                status=$(asc_write POST "betaGroups/$group_id/relationships/betaTesters" "$RUNNER_TEMP/add-body.json" "$RUNNER_TEMP/add-out.json")
              else
                echo "Creating the beta tester in the internal group."
                jq -n --arg email "$EMAIL" --arg group "$group_id" \
                  '{data:{type:"betaTesters",attributes:{email:$email},relationships:{betaGroups:{data:[{type:"betaGroups",id:$group}]}}}}' \
                  > "$RUNNER_TEMP/add-body.json"
                status=$(asc_write POST betaTesters "$RUNNER_TEMP/add-body.json" "$RUNNER_TEMP/add-out.json")
              fi
              rm -f "$RUNNER_TEMP/add-body.json"
              case "$status" in
                2??) echo "Added (HTTP $status)." ;;
                *) explain_error "$status" "$RUNNER_TEMP/add-out.json" tester; exit 1 ;;
              esac
              asc_all "betaGroups/$group_id/betaTesters?limit=200&fields%5BbetaTesters%5D=email" "$testers_json"
              if jq -e --arg e "$email_lc" 'any(.data[]; ((.attributes.email // "") | ascii_downcase) == $e)' "$testers_json" > /dev/null; then
                in_group=yes
              else
                echo "::error::ASC accepted the request but the tester is not listed in the internal group yet; re-run in list mode in a minute."
                in_group=no
              fi
            fi
          fi

          build_json="$RUNNER_TEMP/build.json"
          asc_get builds --data-urlencode "filter[app]=$app_id" --data-urlencode "filter[version]=$BUILD_NUMBER" --data-urlencode 'limit=2' > "$build_json"
          build_id=$(jq -r '.data[0].id // empty' "$build_json")

          # Read back from ASC (never trust a write response): the group's
          # hasAccessToAllBuilds and whether the build is listed in its builds.
          read_group_state() {
            all_builds=no
            build_listed=no
            [ -n "$group_id" ] || return 0
            asc_get "betaGroups/$group_id" > "$RUNNER_TEMP/group-now.json"
            [ "$(jq -r '.data.attributes.hasAccessToAllBuilds // false' "$RUNNER_TEMP/group-now.json")" = 'true' ] && all_builds=yes
            if [ -n "$build_id" ]; then
              asc_all "betaGroups/$group_id/relationships/builds?limit=200" "$RUNNER_TEMP/group-builds.json"
              jq -e --arg b "$build_id" 'any(.data[]; .id == $b)' "$RUNNER_TEMP/group-builds.json" > /dev/null && build_listed=yes
            fi
            return 0
          }
          read_group_state

          grant_not_updatable=no
          # grant-builds: (1) hasAccessToAllBuilds=true on the internal group;
          # (2) only if the build is still not listed afterwards, attach it explicitly.
          if [ "$MODE" = 'grant-builds' ]; then
            if [ "$all_builds" = 'yes' ]; then
              echo "The internal group already has access to all builds."
            else
              echo "Setting hasAccessToAllBuilds=true on the internal group."
              jq -n --arg id "$group_id" '{data:{type:"betaGroups",id:$id,attributes:{hasAccessToAllBuilds:true}}}' > "$RUNNER_TEMP/grant-body.json"
              status=$(asc_write PATCH "betaGroups/$group_id" "$RUNNER_TEMP/grant-body.json" "$RUNNER_TEMP/grant-out.json")
              if [ "$status" = '409' ] && jq -e 'any(.errors[]?; (.code // "") == "ENTITY_ERROR.ATTRIBUTE.NOT_ALLOWED")' "$RUNNER_TEMP/grant-out.json" > /dev/null; then
                # Seen 2026-09-27: "The attribute 'hasAccessToAllBuilds' can not be included in a 'UPDATE' operation".
                # ASC only accepts it when a group is created; fall through to the explicit attach.
                echo "::warning::App Store Connect does not allow changing hasAccessToAllBuilds on an existing group (409 ENTITY_ERROR.ATTRIBUTE.NOT_ALLOWED); attaching the build explicitly instead."
                grant_not_updatable=yes
              else
                case "$status" in 2??) echo "PATCH accepted (HTTP $status)." ;; *) explain_error "$status" "$RUNNER_TEMP/grant-out.json"; exit 1 ;; esac
              fi
              read_group_state
            fi
            if [ -z "$build_id" ]; then
              echo "::error::build $BUILD_NUMBER was not found on App Store Connect"
              exit 1
            fi
            if [ "$build_listed" = 'yes' ]; then
              echo "Build $BUILD_NUMBER is listed in the internal group's builds; no explicit attach needed."
            else
              echo "Build $BUILD_NUMBER is not listed in the group's builds after step 1; attaching it explicitly."
              jq -n --arg id "$build_id" '{data:[{type:"builds",id:$id}]}' > "$RUNNER_TEMP/attach-body.json"
              status=$(asc_write POST "betaGroups/$group_id/relationships/builds" "$RUNNER_TEMP/attach-body.json" "$RUNNER_TEMP/attach-out.json")
              case "$status" in 2??) echo "Attach accepted (HTTP $status)." ;; *) explain_error "$status" "$RUNNER_TEMP/attach-out.json"; exit 1 ;; esac
              read_group_state
            fi
          fi

          # 5. Read-only summary (read back from ASC). Counts and yes/no only, never emails.
          build_state=not-found
          internal_state=not-found
          if [ -n "$build_id" ]; then
            build_state=$(jq -r '.data[0].attributes.processingState // "UNKNOWN"' "$build_json")
            asc_get buildBetaDetails --data-urlencode "filter[build]=$build_id" --data-urlencode 'limit=2' > "$RUNNER_TEMP/build-beta.json"
            internal_state=$(jq -r '.data[0].attributes.internalBuildState // "UNKNOWN"' "$RUNNER_TEMP/build-beta.json")
          fi
          build_available=no
          if [ -n "$build_id" ] && { [ "$all_builds" = 'yes' ] || [ "$build_listed" = 'yes' ]; }; then build_available=yes; fi

          echo "TestFlight internal testers (emails intentionally omitted):"
          echo "  mode:                                  $MODE"
          echo "  internal groups:                       $internal_count"
          echo "  internal group \"$INTERNAL_GROUP_NAME\" present:      $([ -n "$group_id" ] && echo yes || echo no)"
          echo "  testers in that group:                 $(jq '.data | length' "$testers_json")"
          echo "  group hasAccessToAllBuilds:            $all_builds$([ "$grant_not_updatable" = yes ] && echo ' (ASC does not allow changing it on an existing group)')"
          echo "  build $BUILD_NUMBER listed in group builds:     $build_listed"
          echo "  build $BUILD_NUMBER processingState:            $build_state"
          echo "  build $BUILD_NUMBER internalBuildState:         $internal_state"
          echo "  build $BUILD_NUMBER available to the group:     $build_available"
          if [ -n "$EMAIL" ]; then
            echo "  given Apple ID is an internal tester:  $in_group"
          else
            echo "  given Apple ID is an internal tester:  (no email given)"
          fi
          rm -f "$jwt_file" "$testers_json" "$RUNNER_TEMP/existing-tester.json"
          if [ "$MODE" = 'grant-builds' ] && { [ "$build_listed" != 'yes' ] || { [ "$all_builds" != 'yes' ] && [ "$grant_not_updatable" != 'yes' ]; }; }; then
            echo "::error::after grant-builds the read-back shows hasAccessToAllBuilds=$all_builds, build listed=$build_listed"
            exit 1
          fi
