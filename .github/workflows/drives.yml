# Browser drives (tests/*/drive.mjs, tests/*/run.mjs) — the Playwright checks that measure real boxes in the web export.
#
# Until 2026-10-02 no workflow ran any of them. The sweep that day (all ~80 against a fresh export of main) found 14
# red — 12 tests that had fallen behind deliberate product changes, one real UI bug (事件流 header padding), one data
# gap (bundled release dates) — some red for days, all invisible. A drive nobody runs rots.
#
# What runs here is decided by tests/drives.json, not by this file:
#   stub   — needs only the web export + Chromium: 8 shards, on every PR that touches app code (others pass as no-ops), nightly, on demand
#   docker — builds its own bundle with its Dockerfile: nightly + on demand only (≈1–2 min of docker build each)
#   hub / manual — not in CI (each entry says why: a seeded throwaway hub, a packaged binary …)
# src/drive-registry.test.ts (npm test) fails when a drive is missing from the registry, so a new drive has to be put in
# one of those buckets — "not in CI" is allowed, but only with a reason.
#
# Runtime: export ≈ 4 min, then 8 stub shards in parallel ≈ 6–8 min each (balanced by measured secs).

name: drives

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'   # 02:30 UTC+8, after the evening releases
  # Every PR triggers this workflow. `web export` and the 8 `stub drives` shards are REQUIRED
  # checks; with a path filter, a PR that did not touch app code never started them and stayed
  # blocked on "expected" checks forever (2026-11-10). The `changes` job decides whether the
  # drives really run; otherwise the required jobs pass in seconds under their real names.
  pull_request:

concurrency:
  group: drives-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: drives scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.scope.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Release version bump only (the code it ships was already driven when it merged):
          # every changed file is a version pin, and the json/toml pins change nothing but
          # version lines. src/changelog-bundled.ts is generated from the release notes.
          files=$(git diff --name-only "$BASE...$HEAD")
          pins='^(app\.json|package(-lock)?\.json|src/version\.ts|src/changelog-bundled\.ts|src/version-consistency\.test\.ts|src/macos-dmg-retry\.test\.ts|src-tauri/Cargo\.(toml|lock)|src-tauri/tauri\.conf\.json|\.github/workflows/release-desktop-auto-update\.yml)$'
          if [ -n "$files" ] && ! echo "$files" | grep -qvE "$pins" \
            && ! git diff -U0 "$BASE...$HEAD" -- app.json package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json src/version.ts src/version-consistency.test.ts \
                 | grep -E '^[-+][^-+]' | grep -qvE '("?(version|versionCode)"?[[:space:]]*[:=]|APP_VERSION = |^[-+]const expected = )'; then
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "Version bump only: drives pass without running (the shipped code was driven at merge)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # App-code paths: the old pull_request.paths filter.
          if git diff --name-only "$BASE...$HEAD" | grep -qE '^(src/|App\.tsx$|index\.ts$|assets/|tests/|package(-lock)?\.json$|scripts/run-drives\.mjs$|\.github/workflows/drives\.yml$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "No app code changed: drives pass without running." >> "$GITHUB_STEP_SUMMARY"
          fi

  export:
    name: web export
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_DRIVES: ${{ needs.changes.outputs.app }}
    steps:
      - if: env.RUN_DRIVES != 'true'
        run: echo "No app code changed; skipping the web export."
      - if: env.RUN_DRIVES == 'true'
        uses: actions/checkout@v4
      - if: env.RUN_DRIVES == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - if: env.RUN_DRIVES == 'true'
        run: npm ci
      - if: env.RUN_DRIVES == 'true'
        run: npx expo export -p web --output-dir web-export
      - if: env.RUN_DRIVES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: web-export
          retention-days: 3

  stub:
    name: stub drives (${{ matrix.shard }}/8)
    needs: [changes, export]
    # 钉 24.04:GitHub 把 ubuntu-latest 推到 26.04 后,Playwright 的 chromium 直接不支持
    # (ERROR: Playwright does not support chromium on ubuntu26.04-x64),8 个 shard 全红。
    #
    # 🔴 2026-11-11/12：`playwright install --with-deps` 需要 apt，而 runner 的 apt 镜像指向
    #   azure.archive.ubuntu.com，该域名在这些 runner 上整晚解析失败（Temporary failure resolving），
    #   于是「浏览器装不上」被判成代码红，三个 PR 全部卡住。重试没用、把镜像换成
    #   archive.ubuntu.com 也没用（仍解析失败）。
    #   ⇒ 直接用 Playwright 官方镜像跑 shard：浏览器与系统依赖都在镜像里，全程不碰 apt。
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    timeout-minutes: 25
    env:
      RUN_DRIVES: ${{ needs.changes.outputs.app }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - if: env.RUN_DRIVES != 'true'
        run: echo "No app code changed; skipping this shard."
      - if: env.RUN_DRIVES == 'true'
        uses: actions/checkout@v4
      - if: env.RUN_DRIVES == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Drives import a few app modules / fixtures from the repo (tests/test-layout-sweep/harness.mjs, src/*.ts text).
      - if: env.RUN_DRIVES == 'true'
        run: npm ci
      - if: env.RUN_DRIVES == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-export
          path: web-export
      # Same Playwright as the suites' Docker images (mcr.microsoft.com/playwright:v1.58.2-noble).
      - name: Playwright module (browsers come from the image)
        if: env.RUN_DRIVES == 'true'
        run: |
          # 镜像自带 /ms-playwright 与 PLAYWRIGHT_BROWSERS_PATH，不需要 install --with-deps。
          npm install --prefix /tmp/pw --no-audit --no-fund playwright@1.58.2
      - name: Run shard
        if: env.RUN_DRIVES == 'true'
        env:
          PLAYWRIGHT_MODULE: /tmp/pw/node_modules/playwright/index.mjs
          LANG: zh_CN.UTF-8
        run: node scripts/run-drives.mjs --web web-export --out drive-out --shard ${{ matrix.shard }}/8
      - if: always() && env.RUN_DRIVES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drives-shard-${{ matrix.shard }}
          path: drive-out
          retention-days: 7

  docker:
    name: docker drive (${{ matrix.suite }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: test-phone-board, image: test-phone-board }
          - { suite: test-task-issues, image: test-task-issues }
          - { suite: test-task-language, image: test-task-language }
          - { suite: test-task-list-fields, image: test-task-list-fields }
          - { suite: test-task-list-widths, image: test-task-list-widths }
          - { suite: test-task-status-filter, image: test-phone-board }
          - { suite: test-task-tags, image: test-task-tags }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/run-docker-drive.sh ${{ matrix.suite }} ${{ matrix.image }} drive-out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drives-docker-${{ matrix.suite }}
          path: drive-out
          retention-days: 7
