name: Android early channel dispatch

on:
  workflow_run:
    workflows: [android-build]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: android-early-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  dispatch:
    # Only the version-bump push build is automatic. Manual rebuilds are not releases.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify successful main build and dispatch exact source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
          BUILD_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/android-early-dispatch.mjs
