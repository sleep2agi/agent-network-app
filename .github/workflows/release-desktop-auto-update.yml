name: release-desktop-auto-update

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit on main to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-desktop-auto-update
  cancel-in-progress: false

jobs:
  build-release:
    environment: macos-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --bundles app,dmg
          - platform: windows-latest
            args: --bundles nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Require exact merged commit
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.commit }}'
          resolved="$(git rev-parse HEAD)"
          [[ "$requested" =~ ^[0-9a-f]{40}$ && "$resolved" == "$requested" ]]
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$resolved" origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx expo export -p web
      - uses: dtolnay/rust-toolchain@stable
      - name: Build pinned local CommHub sidecar
        shell: bash
        run: |
          npm ci --prefix local-hub-sidecar --ignore-scripts
          npm run build:local-hub-sidecar
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npx tauri icon assets/icon.png
      - name: Check Rust app sources
        working-directory: src-tauri
        run: cargo check --locked
      - name: Verify native credential-store persistence
        working-directory: src-tauri
        run: cargo test --locked desktop_session_round_trip_uses_native_store -- --nocapture
      - name: Verify profile registry excludes secrets
        working-directory: src-tauri
        run: |
          cargo test --locked profile_registry_metadata_never_serializes_secrets -- --nocapture
          cargo test --locked corrupt_profile_registry_is_quarantined_without_data_loss -- --nocapture
          cargo test --locked revoked_profile_marker_is_isolated -- --nocapture

      - name: Decode App Store Connect key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/apple-api-key"
          mkdir -p "$key_dir"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_dir/AuthKey_${APPLE_API_KEY}.p8"
          chmod 600 "$key_dir/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$key_dir/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"

      # One draft release receives both platform bundles, their mandatory
      # updater signatures, and latest.json. Publishing the draft atomically
      # makes it visible to installed clients via releases/latest.
      - uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: "${{ runner.os == 'macOS' && 'Developer ID Application: wenxing hu (446BLT75JZ)' || '' }}"
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: Agent Network Desktop v__VERSION__
          releaseBody: Signed macOS and Windows desktop update. Publish this draft only after installation smoke tests pass.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Smoke exact packaged app with bundled local Hub
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/packaged-local-hub-smoke"
          mkdir -p "$smoke_root/AppData/Roaming" "$smoke_root/AppData/Local"
          if [ "$RUNNER_OS" = "macOS" ]; then
            binary=$(find src-tauri/target/release/bundle/macos -path '*.app/Contents/MacOS/agent-network-desktop' -print -quit)
          else
            binary='src-tauri/target/release/agent-network-desktop.exe'
          fi
          test -f "$binary"
          ANET_PACKAGED_SMOKE=1 \
            ANET_PACKAGED_SMOKE_ROOT="$smoke_root/.anet/app" \
            "$binary" --smoke-local-hub
          ANET_PACKAGED_SMOKE=1 \
            ANET_PACKAGED_SMOKE_ROOT="$smoke_root/.anet/app" \
            "$binary" --smoke-multihub
          test -s "$smoke_root/.anet/app/local-hub/data/commhub.db"
          if grep -R -E 'local-hub-bootstrap-password|atok_|ntok_|utok_' \
            "$smoke_root/.anet/app/local-hub/logs" "$smoke_root/.anet/app/smoke-hub-b/commhub.log"; then
            echo "::error::Packaged Hub logs contain credential material"
            exit 1
          fi

      - name: Enforce desktop distribution size ceiling
        shell: bash
        run: |
          oversized="$(find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -size +55M -print)"
          if [ -n "$oversized" ]; then
            echo "::error::Desktop artifact exceeds the 55 MiB distribution ceiling"
            echo "$oversized"
            exit 1
          fi
