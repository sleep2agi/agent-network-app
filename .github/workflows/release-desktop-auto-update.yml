name: release-desktop-auto-update

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit on main to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-desktop-auto-update
  cancel-in-progress: false

jobs:
  build-release:
    environment: macos-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --bundles app,dmg
          - platform: windows-latest
            args: --bundles nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Require exact merged commit
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.commit }}'
          resolved="$(git rev-parse HEAD)"
          [[ "$requested" =~ ^[0-9a-f]{40}$ && "$resolved" == "$requested" ]]
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$resolved" origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx expo export -p web
      - uses: dtolnay/rust-toolchain@stable
      - name: Build pinned local CommHub sidecar
        shell: bash
        run: |
          npm ci --prefix local-hub-sidecar --ignore-scripts
          npm run build:local-hub-sidecar
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npx tauri icon assets/icon.png
      - name: Check Rust app sources
        working-directory: src-tauri
        run: cargo check --locked
      - name: Verify native credential-store persistence
        working-directory: src-tauri
        run: cargo test --locked desktop_session_round_trip_uses_native_store -- --nocapture
      - name: Verify profile registry excludes secrets
        working-directory: src-tauri
        run: |
          cargo test --locked profile_registry_metadata_never_serializes_secrets -- --nocapture
          cargo test --locked corrupt_profile_registry_is_quarantined_without_data_loss -- --nocapture
          cargo test --locked revoked_profile_marker_is_isolated -- --nocapture

      - name: Decode App Store Connect key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/apple-api-key"
          mkdir -p "$key_dir"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_dir/AuthKey_${APPLE_API_KEY}.p8"
          chmod 600 "$key_dir/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$key_dir/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"

      # One draft release receives both platform bundles, their mandatory
      # updater signatures, and latest.json. Publishing the draft atomically
      # makes it visible to installed clients via releases/latest.
      #
      # 🔴 `releaseBody` is USER-FACING, not a note to ourselves: tauri-action
      # copies it verbatim into latest.json `notes`, and the in-app updater
      # renders those notes in the update prompt. Release *discipline* (audit
      # the draft, publish only after the smoke gates pass, sync the manifest
      # afterwards) belongs in docs/desktop-release-sop.md — never in a string
      # that ships to users. src/release-notes-hygiene.test.ts enforces this.
      - uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: "${{ runner.os == 'macOS' && 'Developer ID Application: wenxing hu (446BLT75JZ)' || '' }}"
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: Agent Network Desktop v__VERSION__
          releaseBody: |-
            Signed and notarized stable update for macOS (Apple Silicon) and Windows (x64).

            What's new in 0.2.34:
            - Switching between agent conversations is faster and stale responses can no longer appear under the wrong agent.
            - Press Enter to send; use Shift+Enter, Ctrl+Enter, or Command+Enter for a newline. Confirming an IME candidate never sends the unfinished composition.
            - High-priority sends move waiting Hub tasks ahead of normal queued work.
            - Dark-mode scrollbars now use the app theme inside the Tauri desktop shell, removing the light gutter.
            - Android adaptive icons now use the current Agent Network brand mark.
            - Node action controls have a clearer visual hierarchy.

            High-priority sending affects queued work; it does not interrupt an already-running Codex turn. Existing installations can update in place; new installations can use the assets below.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Smoke exact packaged app with bundled local Hub
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/packaged-local-hub-smoke"
          mkdir -p "$smoke_root/AppData/Roaming" "$smoke_root/AppData/Local"
          if [ "$RUNNER_OS" = "macOS" ]; then
            binary=$(find src-tauri/target/release/bundle/macos -path '*.app/Contents/MacOS/agent-network-desktop' -print -quit)
          else
            binary='src-tauri/target/release/agent-network-desktop.exe'
          fi
          test -f "$binary"
          ANET_PACKAGED_SMOKE=1 \
            ANET_PACKAGED_SMOKE_ROOT="$smoke_root/.anet/app" \
            "$binary" --smoke-local-hub
          ANET_PACKAGED_SMOKE=1 \
            ANET_PACKAGED_SMOKE_ROOT="$smoke_root/.anet/app" \
            "$binary" --smoke-multihub
          ANET_PACKAGED_SMOKE=1 \
            ANET_PACKAGED_SMOKE_ROOT="$smoke_root/.anet/app" \
            "$binary" --smoke-local-hub-crash-recovery
          migration_root="$RUNNER_TEMP/packaged-local-hub-migration"
          previous_prefix="$RUNNER_TEMP/commhub-preview-28"
          password_file="$RUNNER_TEMP/previous-hub-password"
          npm install --prefix "$previous_prefix" --ignore-scripts \
            @sleep2agi/commhub-server@0.9.0-preview.28
          node scripts/seed-previous-local-hub.mjs \
            "$migration_root/.anet/app" \
            "$previous_prefix/node_modules/@sleep2agi/commhub-server" \
            "$password_file"
          ANET_PACKAGED_SMOKE=1 \
            ANET_PACKAGED_SMOKE_ROOT="$migration_root/.anet/app" \
            ANET_PREVIOUS_HUB_PASSWORD_FILE="$password_file" \
            "$binary" --smoke-local-hub-migration
          failed_migration_root="$RUNNER_TEMP/packaged-local-hub-failed-migration"
          failed_password_file="$RUNNER_TEMP/failed-migration-password"
          node scripts/seed-previous-local-hub.mjs \
            "$failed_migration_root/.anet/app" \
            "$previous_prefix/node_modules/@sleep2agi/commhub-server" \
            "$failed_password_file"
          ANET_PACKAGED_SMOKE=1 \
            ANET_PACKAGED_SMOKE_ROOT="$failed_migration_root/.anet/app" \
            ANET_PREVIOUS_HUB_PASSWORD_FILE="$failed_password_file" \
            "$binary" --smoke-local-hub-failed-migration
          corrupt_root="$RUNNER_TEMP/packaged-local-hub-corrupt-data"
          ANET_PACKAGED_SMOKE=1 \
            ANET_PACKAGED_SMOKE_ROOT="$corrupt_root/.anet/app" \
            "$binary" --smoke-local-hub-corrupt-data
          test -s "$smoke_root/.anet/app/local-hub/data/commhub.db"
          test -s "$migration_root/.anet/app/local-hub/data/commhub.db"
          test -s "$failed_migration_root/.anet/app/local-hub/data/commhub.db"
          if grep -R -E 'local-hub-bootstrap-password|atok_|ntok_|utok_' \
            "$smoke_root/.anet/app/local-hub/logs" \
            "$smoke_root/.anet/app/smoke-hub-b/commhub.log" \
            "$smoke_root/.anet/app/smoke-hub-c/commhub.log" \
            "$migration_root/.anet/app/local-hub/logs" \
            "$failed_migration_root/.anet/app/local-hub/logs" \
            "$corrupt_root/.anet/app/local-hub/logs"; then
            echo "::error::Packaged Hub logs contain credential material"
            exit 1
          fi

      - name: Audit macOS app removal and reinstall data retention
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          source_app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          install_parent="$RUNNER_TEMP/Applications"
          installed_app="$install_parent/Agent Network.app"
          retention_root="$RUNNER_TEMP/install-retention/.anet/app"
          test -d "$source_app"
          mkdir -p "$install_parent"
          ditto "$source_app" "$installed_app"
          codesign --verify --deep --strict "$installed_app"
          ANET_PACKAGED_SMOKE=1 ANET_PACKAGED_SMOKE_ROOT="$retention_root" \
            "$installed_app/Contents/MacOS/agent-network-desktop" --smoke-local-hub
          test -s "$retention_root/local-hub/data/commhub.db"
          rm -rf "$installed_app"
          test ! -e "$installed_app"
          test -s "$retention_root/local-hub/data/commhub.db"
          test -s "$retention_root/profiles/index.json"
          ditto "$source_app" "$installed_app"
          ANET_PACKAGED_SMOKE=1 ANET_PACKAGED_SMOKE_ROOT="$retention_root" \
            "$installed_app/Contents/MacOS/agent-network-desktop" --smoke-local-hub
          test -s "$retention_root/local-hub/data/commhub.db"

      - name: Audit Windows NSIS uninstall and reinstall data retention
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'AgentNetworkInstalled'
          $retentionRoot = Join-Path $env:RUNNER_TEMP 'install-retention/.anet/app'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS install failed: $($install.ExitCode)" }
          $binary = Get-ChildItem $installDir -Recurse -Filter 'agent-network-desktop.exe' | Select-Object -First 1
          if (-not $binary) { throw 'installed desktop executable missing' }
          $env:ANET_PACKAGED_SMOKE = '1'
          $env:ANET_PACKAGED_SMOKE_ROOT = $retentionRoot
          $smoke = Start-Process -FilePath $binary.FullName -ArgumentList '--smoke-local-hub' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "installed smoke failed: $($smoke.ExitCode)" }
          $database = Join-Path $retentionRoot 'local-hub/data/commhub.db'
          $profiles = Join-Path $retentionRoot 'profiles/index.json'
          if (-not (Test-Path $database) -or (Get-Item $database).Length -eq 0) { throw 'retention database missing' }
          $uninstaller = Get-ChildItem $installDir -Recurse -Filter '*uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'NSIS uninstaller missing' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstall failed: $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path $binary.FullName) { throw 'NSIS uninstall left the application binary installed' }
          if (-not (Test-Path $database) -or -not (Test-Path $profiles)) { throw 'NSIS uninstall deleted retained app data' }
          $reinstall = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($reinstall.ExitCode -ne 0) { throw "NSIS reinstall failed: $($reinstall.ExitCode)" }
          $binary = Get-ChildItem $installDir -Recurse -Filter 'agent-network-desktop.exe' | Select-Object -First 1
          $smoke = Start-Process -FilePath $binary.FullName -ArgumentList '--smoke-local-hub' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "reinstalled smoke failed: $($smoke.ExitCode)" }
          if (-not (Test-Path $database) -or (Get-Item $database).Length -eq 0) { throw 'reinstall lost retained database' }

      - name: Enforce desktop distribution size ceiling
        shell: bash
        run: |
          oversized="$(find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -size +55M -print)"
          if [ -n "$oversized" ]; then
            echo "::error::Desktop artifact exceeds the 55 MiB distribution ceiling"
            echo "$oversized"
            exit 1
          fi
