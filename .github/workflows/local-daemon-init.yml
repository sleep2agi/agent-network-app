name: local-daemon-init

on:
  pull_request:
    paths:
      - src-tauri/src/local_daemon.rs
      - tests/local-daemon-init/**
      - .github/workflows/local-daemon-init.yml
  push:
    branches: [main]
    paths:
      - src-tauri/src/local_daemon.rs
      - tests/local-daemon-init/**
      - .github/workflows/local-daemon-init.yml

permissions:
  contents: read

jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      SHELL: /bin/sh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
      - run: cargo test --locked --manifest-path tests/local-daemon-init/Cargo.toml -- --test-threads=1
