name: release-macos-signed

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit on main to build and sign
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-macos-signed
  cancel-in-progress: false

jobs:
  sign-notarize-release:
    runs-on: macos-14
    environment: macos-signing
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Require an exact commit already on main
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.commit }}'
          resolved="$(git rev-parse HEAD)"
          if [[ ! "$requested" =~ ^[0-9a-f]{40}$ ]] || [[ "$resolved" != "$requested" ]]; then
            echo "::error::commit must be the exact 40-character SHA checked out by this job"
            exit 1
          fi
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$resolved" origin/main; then
            echo "::error::$resolved is not on origin/main; signing unmerged branch code is forbidden"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'

      - run: npm ci

      - name: Test
        run: npm test

      - name: Export RN web bundle
        run: npx expo export -p web

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Generate icons
        run: npx tauri icon assets/icon.png

      - name: Decode App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_API_KEY_BASE64" ]]; then
            exit 0
          fi
          key_dir="$RUNNER_TEMP/apple-api-key"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_dir/AuthKey_${APPLE_API_KEY}.p8"
          chmod 600 "$key_dir/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$key_dir" >> "$GITHUB_ENV"

      - name: Build, Developer ID sign, notarize, and staple
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: wenxing hu (446BLT75JZ)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          if [[ -z "$APPLE_API_KEY" && ( -z "$APPLE_ID" || -z "$APPLE_PASSWORD" || -z "$APPLE_TEAM_ID" ) ]]; then
            echo "::error::notarization needs either App Store Connect API credentials or APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID"
            exit 1
          fi
          npx tauri build --bundles app,dmg

      - name: Verify signed and notarized app
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/release/bundle/macos/Agent Network.app"
          dmg="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -d "$app"
          test -f "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -F 'Authority=Developer ID Application: wenxing hu (446BLT75JZ)' "$RUNNER_TEMP/codesign.txt"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Stage release assets
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          short="$(git rev-parse --short=7 HEAD)"
          tag="desktop-v${version}-signed-${short}"
          mkdir -p out
          dmg="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          cp "$dmg" "out/Agent.Network_${version}_aarch64.dmg"
          ditto -c -k --keepParent \
            "src-tauri/target/release/bundle/macos/Agent Network.app" \
            "out/AgentNetwork_${version}_aarch64_${short}.app.zip"
          shasum -a 256 out/* | tee out/SHA256SUMS.txt
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-signed-${{ steps.stage.outputs.version }}
          path: out/*
          retention-days: 14

      - name: Create independent prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.stage.outputs.tag }}
          COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; refusing to overwrite it"
            exit 1
          fi
          gh release create "$TAG" out/* \
            --target "$COMMIT" \
            --prerelease \
            --title "$TAG" \
            --notes "macOS arm64 desktop build. Developer ID signed, Apple notarized, stapled, and verified in GitHub Actions. Exact commit: $COMMIT"
