# Android APK build (Vincent /loop perf → A: out an APK for on-device regression).
# android/ is gitignored (Expo CNG), so we prebuild it in CI, then assembleRelease
# so the JS bundle is embedded (a debug APK would expect a Metro dev server and
# not run standalone). Expo's generated release buildType falls back to the debug
# signing config, so the APK is installable for testing without a release keystore.
# Artifact is downloadable from the run page.
name: android-build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # 2026-09-15 runs #34948072790/#rerun:action 默认装 `tools platform-tools`,runner 镜像升到
          # cmdline-tools 16 后 sdkmanager 里已没有 `tools` 这个包 → "Failed to find package 'tools'" 退出 1。
          # 我们只需要 platform-tools(adb 等);SDK platform/build-tools 由 Gradle 按 build.gradle 自装。
          packages: platform-tools

      - run: npm ci

      - name: Prebuild Android (android/ is gitignored — regenerate)
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (debug-signed, JS embedded)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          f=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "path=$f" >> "$GITHUB_OUTPUT"
          ls -lh "$f"

      # In-app update (Settings → 软件更新) installs this APK over the one on the phone. Android only
      # allows that when (a) the signing certificate is the same as the installed APK's and (b) the
      # versionCode is not lower. Every APK attached to desktop-v0.2.63 … desktop-v0.2.98 was signed
      # by the same certificate (the React Native template debug key that `expo prebuild` writes into
      # android/app/debug.keystore) and carried versionCode 1. Check both on the real artefact, plus
      # the REQUEST_INSTALL_PACKAGES permission the updater needs to hand the file to the installer.
      - name: Verify APK (versionCode, install permission, signing certificate)
        env:
          APK: ${{ steps.apk.outputs.path }}
          # SHA-256 of the signing certificate of every released APK so far. Changing it means every
          # existing install fails to update in place (「应用未安装 / 与已安装的应用签名冲突」).
          EXPECTED_SIGNER_SHA256: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c
        run: |
          set -euo pipefail
          bt_list=$(ls "$ANDROID_HOME/build-tools" | sort -V)
          BT="$ANDROID_HOME/build-tools/${bt_list##*$'\n'}"
          expected_code=$(node -e 'const v=require("./app.json").expo.version.split(".").map(Number);process.stdout.write(String(v[0]*1e6+v[1]*1e3+v[2]))')
          badging=$("$BT/aapt2" dump badging "$APK")
          code=$(sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p" <<<"$badging")
          name=$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" <<<"$badging")
          echo "versionCode=$code versionName=$name (expected versionCode $expected_code)"
          if [ "$code" != "$expected_code" ]; then echo "::error::versionCode is '$code', expected $expected_code"; exit 1; fi
          # here-string, not `printf | grep -q`: under pipefail grep -q exiting early SIGPIPEs printf (141).
          if ! grep -Fq "uses-permission: name='android.permission.REQUEST_INSTALL_PACKAGES'" <<<"$badging"; then
            echo "::error::APK lacks android.permission.REQUEST_INSTALL_PACKAGES"; exit 1
          fi
          # 0.2.100: no orientation lock. app.json "portrait" → android:screenOrientation="portrait" → Android
          # letterboxes the app on an unfolded foldable / tablet in landscape and the two-pane layout never
          # gets the wide width (Vincent's foldable screenshot). expo writes "unspecified" (-1) for "default".
          # Any other screenOrientation value, or resizeableActivity=false, on any activity fails the build.
          tree=$("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK")
          locks=$(grep -E ':screenOrientation\(0x[0-9a-f]+\)=' <<<"$tree" | grep -vE '\)=-1$' || true)
          if [ -n "$locks" ]; then echo "::error::APK locks screen orientation (expected none / unspecified): $locks"; exit 1; fi
          unresizable=$(grep -E ':resizeableActivity\(0x[0-9a-f]+\)=(false|0)' <<<"$tree" || true)
          if [ -n "$unresizable" ]; then echo "::error::APK sets resizeableActivity=false: $unresizable"; exit 1; fi
          echo "orientation: no screenOrientation lock, resizeableActivity not false"
          # 0.2.107 message notifications: Android 13+ needs POST_NOTIFICATIONS declared (or the runtime
          # prompt never shows), and the 「后台保持连接」 foreground service must carry its
          # foregroundServiceType in the manifest plus the matching permission — on Android 14+ a
          # startForeground() whose type is not declared throws and the app crashes.
          for perm in POST_NOTIFICATIONS FOREGROUND_SERVICE FOREGROUND_SERVICE_REMOTE_MESSAGING; do
            if ! grep -Fq "uses-permission: name='android.permission.$perm'" <<<"$badging"; then
              echo "::error::APK lacks android.permission.$perm"; exit 1
            fi
          done
          svc=$(grep -n 'expo.modules.anetkeepalive.AnetKeepAliveService' <<<"$tree" || true)
          if [ -z "$svc" ]; then echo "::error::APK manifest has no AnetKeepAliveService"; exit 1; fi
          # remoteMessaging = 0x200. Read the attribute that follows the service element, not any one.
          svc_line=${svc%%:*}
          svc_type=$(tail -n "+$svc_line" <<<"$tree" | grep -m1 -E ':foregroundServiceType\(0x[0-9a-f]+\)=' || true)
          # aapt2 prints flags as hex, e.g. `…foregroundServiceType(0x01010599)=0x00000200`. Compare numerically.
          svc_val=${svc_type##*=}
          if [[ "$svc_val" =~ ^(0x[0-9a-fA-F]+|[0-9]+)$ ]] && (( (svc_val & 0x200) != 0 )); then
            echo "keep-alive service: foregroundServiceType includes remoteMessaging ($svc_val)"
          else
            echo "::error::AnetKeepAliveService foregroundServiceType is not remoteMessaging: '$svc_type'"; exit 1
          fi
          certs=$("$BT/apksigner" verify --print-certs "$APK")
          printf '%s\n' "$certs"
          # apksigner prints `Signer #1 certificate …` when a v1 signature is present and
          # `V2 Signer: certificate …` for v2-only APKs (minSdk ≥ 24, which is what we build).
          # An empty match falls through to the mismatch error below, never to a pass.
          digest=$(sed -n -E 's/^(Signer #1|V[0-9]+ Signer):? certificate SHA-256 digest: //p' <<<"$certs")
          digest=${digest%%$'\n'*}
          if [ "$digest" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error::signing certificate $digest differs from the released APKs ($EXPECTED_SIGNER_SHA256) — installed apps could not update in place"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-network-android-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
