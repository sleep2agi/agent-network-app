# Tauri desktop builds (Vincent tg 824: Electron → Tauri).
# macOS must compile on a mac runner — no cross-build from Linux.
name: desktop-tauri

on:
  # 🔴 加 push 的理由(见 #30 的评论)：在这之前这条流水线**只有** workflow_dispatch。
  #    运行历史：main 上最近一次是 2026-06-17，而 #40（补 windows-x64）是 08-18 合的 ——
  #    也就是说「main 能不能打出 Mac/Win 包」在有人手动点之前从来没被验证过，
  #    任何把打包改坏的改动都能进 main 并无限期留着，直到下一次有人想起来点它，
  #    而那通常正是「要发版了」的时候。
  #
  #    **没有加 paths 收窄**，这是有意的：本仓是 public，Actions 分钟数免费（含 macOS runner），
  #    main 近 7 天 9 个提交 —— 收窄省不下任何成本，只会拿覆盖面去换一个不存在的节省。
  #    而打包的输入几乎就是半个仓（npm ci 吃 package.json，expo export 吃 App.tsx/src/app.json/assets，
  #    tauri build 吃 src-tauri），任何一份收窄清单都注定会漏。
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'

      - run: npm ci

      - name: Typecheck app sources
        run: npm run typecheck

      - name: Export RN web bundle
        run: npx expo export -p web

      - uses: dtolnay/rust-toolchain@stable

      - name: Build pinned local CommHub sidecar
        shell: bash
        run: |
          npm ci --prefix local-hub-sidecar --ignore-scripts
          npm run build:local-hub-sidecar

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Generate icons
        run: npx tauri icon assets/icon.png

      - name: Verify profile credential and registry contracts
        working-directory: src-tauri
        run: |
          cargo test --locked desktop_session_round_trip_uses_native_store -- --nocapture
          cargo test --locked profile_registry_metadata_never_serializes_secrets -- --nocapture
          cargo test --locked corrupt_profile_registry_is_quarantined_without_data_loss -- --nocapture
          cargo test --locked revoked_profile_marker_is_isolated -- --nocapture
          cargo test --locked local_credentials:: -- --nocapture

      - name: Build (unsigned)
        # This validation workflow deliberately has no updater signing key.
        # Disable updater archives here; signed Release builds keep them on.
        run: npx tauri build --bundles app,dmg --config .github/tauri.unsigned.conf.json

      - name: Stage artifacts
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/dmg/*.dmg out/ || true
          ditto -c -k --keepParent "src-tauri/target/release/bundle/macos/Agent Network.app" out/AgentNetwork-tauri-arm64-mac.zip
          oversized="$(find out -type f -size +55M -print)"
          if [ -n "$oversized" ]; then
            echo "::error::Desktop artifact exceeds the 55 MiB distribution ceiling"
            echo "$oversized"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: out/*
          retention-days: 14

  windows-x64:
    # Windows 必须在 windows runner 上编译，理由和上面 mac 那条注释一样：
    # Tauri 的 Windows 打包要 WiX(msi) 与 NSIS(exe)，这两个都拿不到跨平台产物。
    #
    # 🔴 2026-08-19 实测：三个仓（agent-network / agent-network-dashboard /
    #    agent-network-app）的所有 workflow 里，Windows 打包命中数是 **0** ——
    #    也就是说 Vincent 目标里与 Mac 并列的那半，此前没有任何流水线。
    #    这个 job 就是补那一格。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'

      - run: npm ci

      - name: Typecheck app sources
        run: npm run typecheck

      - name: Export RN web bundle
        run: npx expo export -p web

      - uses: dtolnay/rust-toolchain@stable

      - name: Build pinned local CommHub sidecar
        shell: bash
        run: |
          npm ci --prefix local-hub-sidecar --ignore-scripts
          npm run build:local-hub-sidecar

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Generate icons
        # 这一步会生成 icons/icon.ico —— Windows 的可执行图标只认 .ico，
        # 而 tauri.conf.json 的 bundle.icon 里已经列了它。
        run: npx tauri icon assets/icon.png

      - name: Verify profile credential and registry contracts
        working-directory: src-tauri
        run: |
          cargo test --locked desktop_session_round_trip_uses_native_store -- --nocapture
          cargo test --locked profile_registry_metadata_never_serializes_secrets -- --nocapture
          cargo test --locked corrupt_profile_registry_is_quarantined_without_data_loss -- --nocapture
          cargo test --locked revoked_profile_marker_is_isolated -- --nocapture
          cargo test --locked local_credentials:: -- --nocapture

      - name: Build (unsigned)
        # nsis = 安装器 .exe；msi = WiX 安装包。两个都要，因为分发方式不同：
        # nsis 体积小、适合直接给人；msi 适合 IT 批量部署。
        run: npx tauri build --bundles nsis,msi --config .github/tauri.unsigned.conf.json

      - name: Stage artifacts
        # 用 bash 而不是默认的 pwsh：windows runner 自带 git-bash，
        # 这样这一步和上面 mac job 的写法保持一致，读的人不用在两种 shell 之间切换。
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*.exe out/ || true
          cp src-tauri/target/release/bundle/msi/*.msi  out/ || true
          # 🔴 `|| true` 是照 mac job 抄的，但它会把「一个产物都没出」变成绿。
          #    所以这里补一条断言：out/ 空 ⇒ 直接失败。
          if [ -z "$(ls -A out)" ]; then
            echo "::error::Windows 打包没有产出任何 .exe/.msi —— 上面的 tauri build 说成功了，但产物目录是空的"
            exit 1
          fi
          oversized="$(find out -type f -size +55M -print)"
          if [ -n "$oversized" ]; then
            echo "::error::Desktop artifact exceeds the 55 MiB distribution ceiling"
            echo "$oversized"
            exit 1
          fi
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/*
          retention-days: 14
