# iOS signed .ipa build + TestFlight upload (Vincent: ship iOS to TestFlight
# without an Expo/EAS account — raw xcodebuild + Apple toolchain on a mac runner).
#
# ios/ is NOT committed (Expo CNG), so we `expo prebuild -p ios` in CI to
# generate the Xcode project, then archive + export an App Store .ipa and push
# it to TestFlight using an App Store Connect API key (.p8) for ALL auth —
# code signing AND upload. No Apple ID / app-specific password, no EAS.
#
# ── How signing works here ──────────────────────────────────────────────────
# A protected team App Store Connect API key creates an ephemeral Apple
# Distribution certificate and IOS_APP_STORE profile. The runner imports the
# matching private key into a temporary keychain, signs manually, then revokes
# and deletes all temporary signing assets in an always-run cleanup step. This
# avoids both registered development devices and long-lived iOS P12 secrets.
#
# ── Assumptions (see report) ────────────────────────────────────────────────
#  * An App Store Connect app record for bundle id `top.vansin.agentnetwork`
#    already exists under team 446BLT75JZ. Auto-provisioning can create certs
#    & profiles but NOT the app record — create it once in App Store Connect.
#  * The ASC API key has the "App Manager" role (needed to manage signing
#    assets and to upload builds to TestFlight).
#  * macOS runners are billed at 10x Linux minutes — this is manual-trigger only.

name: ios-build

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Upload the built .ipa to TestFlight"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ios-ipa:
    # Reuse the reviewed signing environment used by desktop notarization.
    # It already owns the App Store Connect API key; keeping one credential
    # namespace avoids stale duplicate ASC_* repository secrets.
    environment: macos-signing
    # macos-14 == Apple silicon, recent Xcode. Pin rather than macos-latest so
    # an Xcode bump can't silently break signing/export.
    # macos-14 ships Xcode 15.4; React Native requires >= 16.1
    # ("[!] Invalid `Podfile` file: Please upgrade XCode." at pod install).
    # macos-15 ships Xcode 16.x.
    runs-on: macos-15

    env:
      # Bundle id / team are also read by Expo from app.json + this team id.
      APPLE_TEAM_ID: "446BLT75JZ"
      BUNDLE_ID: "top.vansin.agentnetwork"
      # Avoid the precompiled React Native framework ABI mismatch previously
      # observed in archive builds. Build native modules from this checkout.
      EXPO_USE_PRECOMPILED_MODULES: "false"
      # App Store Connect rejects a reused CFBundleVersion. The repository run
      # number is numeric and monotonically increases across manual builds.
      IOS_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Generate ios/ from app.json (Expo CNG). --no-install: we already ran
      # `npm ci`; pods are installed explicitly in the next step for clarity.
      - name: Expo prebuild (generate ios/)
        run: npx expo prebuild --platform ios --no-install

      - name: CocoaPods install
        run: |
          set -euo pipefail
          cd ios
          pod install

      # Resolve the actual scheme name & workspace path Expo generated, instead
      # of hard-coding (Expo derives them from app.json "name": "Agent Network").
      - name: Resolve Xcode workspace & scheme
        id: xc
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "::error::No .xcworkspace under ios/ — pod install should have created it; check the CocoaPods step above"; exit 1
          fi
          # First shared scheme; Expo names it after the project (e.g. "AgentNetwork").
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["workspace"]["schemes"][0])')
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME"       >> "$GITHUB_OUTPUT"
          echo "Resolved workspace=$WORKSPACE scheme=$SCHEME"

      # Drop the base64 App Store Connect API key where xcodebuild/altool
      # auto-find it. The same reviewed environment secret is used by desktop
      # notarization, so iOS cannot silently drift onto a stale duplicate key.
      - name: Install App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          # sanity: must be a valid PEM private key now
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH" || { echo "::error::APPLE_API_KEY_BASE64 did not decode to a PEM .p8"; exit 1; }
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Prepare ephemeral App Store distribution signing
        id: signing
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/ios-distribution-signing.mjs prepare

      # Archive with the exact ephemeral App Store profile. Automatic archive
      # signing asks for a Development profile (and therefore a registered
      # device), so release CI intentionally uses manual distribution signing.
      - name: Archive (xcodebuild)
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AgentNetwork.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.signing.outputs.profile_name }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${{ steps.signing.outputs.keychain_path }}" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            clean archive

      # Fail before export if Xcode silently falls back to a Development
      # identity/profile. App Store profiles contain no device allow-list and
      # do not grant get-task-allow.
      - name: Verify archive uses App Store distribution signing
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/AgentNetwork.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          [ -n "$APP" ] || { echo "::error::Archive contains no application"; exit 1; }
          codesign -dvv "$APP" 2> "$RUNNER_TEMP/archive-codesign.txt"
          grep -F 'Authority=Apple Distribution:' "$RUNNER_TEMP/archive-codesign.txt"

          PROFILE="$APP/embedded.mobileprovision"
          [ -f "$PROFILE" ] || { echo "::error::Archive has no embedded provisioning profile"; exit 1; }
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/archive-profile.plist"
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/archive-profile.plist" >/dev/null 2>&1; then
            echo "::error::Archive profile contains registered devices; expected App Store distribution"
            exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$RUNNER_TEMP/archive-profile.plist")" = "false"
          application_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/archive-profile.plist")
          test "$application_id" = "$APPLE_TEAM_ID.$BUNDLE_ID"

      # Export the archive to an App Store .ipa using the committed ExportOptions.
      - name: Export .ipa
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          cp ios-ci/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Set :signingStyle manual' "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :signingCertificate string Apple Distribution' "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string ${{ steps.signing.outputs.profile_name }}" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AgentNetwork.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "::error::No .ipa produced"; exit 1; }
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"

      # Upload the .ipa as an artifact FIRST so it is downloadable even if the
      # TestFlight upload below fails.
      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-network-ios-ipa-${{ github.run_number }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      # Push to TestFlight with the same ASC API key. altool reads the key from
      # ~/.appstoreconnect/private_keys/AuthKey_<id>.p8 by id+issuer.
      - name: Upload to TestFlight (altool)
        if: ${{ inputs.upload_testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Revoke and remove ephemeral signing assets
        if: ${{ always() }}
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/ios-distribution-signing.mjs cleanup
