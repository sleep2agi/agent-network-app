name: post release channel sync

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published desktop-vX.Y.Z tag; also the manual recovery entry'
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: post-release-sync-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify orchestration guards
        run: node --test scripts/post-release-sync.test.mjs
      - name: Dispatch mirrors and fallback; verify public channels
        env:
          GH_TOKEN: ${{ github.token }}
          # Fine-grained token: Actions write on sleep2agi/agent-network only.
          # Missing credentials fail visibly; never silently skip the fallback.
          HUB_ACTIONS_TOKEN: ${{ secrets.HUB_ACTIONS_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node scripts/post-release-sync.mjs
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: post-release-sync-${{ github.run_id }}
          path: post-release-sync-evidence.json
          if-no-files-found: warn
