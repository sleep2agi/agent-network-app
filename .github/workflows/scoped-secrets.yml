name: Scoped secrets client core
on:
  pull_request:
    paths:
      - 'src/scoped-secrets*'
      - 'src/ScopedSecretsSection.tsx'
      - 'src/i18n-scoped-secrets.ts'
      - 'src/NodeDetailScreen.tsx'
      - 'src/DaemonManagementScreen.tsx'
      - 'tests/scoped-secrets/**'
      - '.github/workflows/scoped-secrets.yml'
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Core protocol and typecheck first
        run: |
          docker build --target core -f tests/scoped-secrets/Dockerfile -t scoped-secrets-core .
          docker run --rm --network none scoped-secrets-core
      - name: Exported node and Daemon UI, synthetic Hub
        run: |
          docker build --target browser -f tests/scoped-secrets/Dockerfile -t scoped-secrets-ui .
          docker run --rm --network none --tmpfs /output scoped-secrets-ui
