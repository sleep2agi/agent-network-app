name: Windows rollback script checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/windows-rollback-*.ps1'
      - 'scripts/windows-rollback-release-assets.json'
      - '.github/workflows/windows-rollback-script-check.yml'
permissions:
  contents: read
jobs:
  script-checks:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse rollback helpers and check fixture preservation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('scripts/windows-rollback-install-step.ps1', 'scripts/windows-rollback-data-check.ps1', 'scripts/windows-rollback-download.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $path), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
          $root = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $root | Out-Null
          $fixture = Join-Path $root 'fixture.txt'
          $manifest = Join-Path $root 'baseline.json'
          'original' | Set-Content -LiteralPath $fixture
          $helper = './scripts/windows-rollback-data-check.ps1'
          & $helper -Mode capture -Files @($fixture) -Manifest $manifest
          & $helper -Mode verify -Files @($fixture) -Manifest $manifest
          'changed' | Set-Content -LiteralPath $fixture
          $rejected = $false
          try { & $helper -Mode verify -Files @($fixture) -Manifest $manifest }
          catch { $rejected = $true }
          if (-not $rejected) { throw 'Changed fixture was accepted' }
          Write-Output 'Parser and fixture checks passed; installer execution and rollback are not tested.'
      - name: Verify pinned release downloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($kind in @('nsis', 'msi')) {
            $destination = Join-Path $env:RUNNER_TEMP "rollback-download-$kind"
            $records = @(./scripts/windows-rollback-download.ps1 -Kind $kind -Destination $destination)
            if ($records.Count -ne 2) { throw "Expected two verified $kind downloads" }
            $records | ConvertTo-Json | Write-Output
          }
