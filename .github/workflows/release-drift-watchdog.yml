name: release-drift-watchdog

# 发布后隔一段时间自动核对线上四处版本是否还一致 —— 0.2.289 的静态兜底停在 0.2.288
# 且没有 Linux 条目、没人发现；这类「静默漂移」应该由机器每小时看一眼,而不是等人想起。
# 只在 main 上跑,只做 GET/HEAD,不写任何东西;不一致就让 job 红。
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compare the published release with the mirror and the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-drift-check.mjs
