name: release-drift-watchdog

# 发布后隔一段时间自动核对线上四处版本是否还一致 —— 0.2.289 的静态兜底停在 0.2.288
# 且没有 Linux 条目、没人发现；这类「静默漂移」应该由机器每小时看一眼,而不是等人想起。
# 只在 main 上跑,只做 GET/HEAD,不写任何东西;不一致就让 job 红。
on:
  # 事件驱动优先 + cron 兜底（2026-11-19：实测 cron 会被拖到 11–13 小时，不能当发布后的保障）。
  # fallback 在 publish 之后才合入，事件触发那一刻可能还没追上 —— 脚本对 fallback 只记 WARN，不判 FAIL；
  # 站点 dynamic / 镜像的「落后」由脚本自带的发布窗口 grace 降级，不会误红。
  release:
    types: [published]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-test the release-window grace rule
        run: node scripts/release-drift-check.mjs --self-test
      - name: Compare the published release with the mirror and the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # 用 event 里的 tag 而不是 releases/latest；cron/dispatch 时为空，脚本回退 latest。
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release-drift-check.mjs
