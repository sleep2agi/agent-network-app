[package]
name = "local-daemon-init-regression"
version = "0.1.0"
edition = "2021"
publish = false

# Compile the production installer without the Tauri windowing dependencies.
[dependencies]
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
